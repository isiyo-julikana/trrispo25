apiVersion: apps/v1
kind: Deployment
metadata:
  name: trrispo25
  namespace: trrispo25
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trrispo25
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: trrispo25
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: isiyo/trrispo25:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: trrispo25-config
            - secretRef:
                name: trrispo25-secret
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
